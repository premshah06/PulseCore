version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# PulseCore — full stack
#
# Startup order (enforced by depends_on + healthchecks):
#   1. kafka            KRaft broker, no Zookeeper
#   2. mongo1/2/3       RS nodes
#   3. mongo-init       initiates rs0 + creates app user (one-shot)
#   4. inference-*      one sidecar per domain, loads ONNX model from ./ml/models
#   5. consumer         Kafka → MongoDB raw_events + calls inference sidecar
#   6. api              FastAPI REST + WebSocket  (health: GET /health)
#   7. frontend         Next.js dashboard          (health: GET /)
#   8. producer-*       one producer per domain (starts after kafka is ready)
#
# Health check URLs (all on the Docker bridge network):
#   kafka        : kafka-topics.sh --list (internal only)
#   mongo*       : mongosh ping
#   inference-*  : http://inference-{domain}:8001/health
#   api          : http://api:8000/health
#   frontend     : http://frontend:3000/
#
# Sharding strategy (production):
#   raw_events → hashed  { source_id: "hashed" }
#   anomalies  → ranged  { domain: 1, timestamp: -1 }
# ─────────────────────────────────────────────────────────────────────────────

x-python-base: &python-base
  build:
    context: .
  restart: unless-stopped
  networks:
    - pulsecore-net
  env_file:
    - .env

x-mongo-node: &mongo-node
  image: mongo:7
  restart: unless-stopped
  networks:
    - pulsecore-net
  command: mongod --replSet rs0 --bind_ip_all

services:

  # ── Kafka (KRaft — no Zookeeper) ───────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: pulsecore-kafka
    restart: unless-stopped
    networks:
      - pulsecore-net
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_KRAFT_CLUSTER_ID: "pulsecore-cluster-01"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-3}"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_LOG_RETENTION_HOURS: "${KAFKA_LOG_RETENTION_HOURS:-168}"
      KAFKA_CFG_MESSAGE_MAX_BYTES: "1048576"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── MongoDB replica set — 3 nodes ──────────────────────────────────────────
  mongo1:
    <<: *mongo-node
    container_name: pulsecore-mongo1
    hostname: mongo1
    ports:
      - "${MONGO_PORT_PRIMARY:-27017}:27017"
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo2:
    <<: *mongo-node
    container_name: pulsecore-mongo2
    hostname: mongo2
    ports:
      - "${MONGO_PORT_SECONDARY1:-27018}:27017"
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo3:
    <<: *mongo-node
    container_name: pulsecore-mongo3
    hostname: mongo3
    ports:
      - "${MONGO_PORT_SECONDARY2:-27019}:27017"
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: initiates rs0 + creates app user
  mongo-init:
    image: mongo:7
    container_name: pulsecore-mongo-init
    networks:
      - pulsecore-net
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    restart: "no"
    environment:
      MONGO_APP_USER: ${MONGO_APP_USER:-pulse}
      MONGO_APP_PASS: ${MONGO_APP_PASS:-pulse}
    command: >
      bash -c "
        mongosh --host mongo1:27017 --eval \"
          rs.status().ok == 1 || rs.initiate({
            _id: 'rs0',
            members: [
              { _id: 0, host: 'mongo1:27017', priority: 2 },
              { _id: 1, host: 'mongo2:27017', priority: 1 },
              { _id: 2, host: 'mongo3:27017', priority: 1 }
            ]
          });
          sleep(3000);
          var admin = db.getSiblingDB('admin');
          if (!admin.getUser('${MONGO_APP_USER:-pulse}')) {
            admin.createUser({
              user: '${MONGO_APP_USER:-pulse}',
              pwd:  '${MONGO_APP_PASS:-pulse}',
              roles: [
                { role: 'readWrite',      db: 'pulsecore' },
                { role: 'dbAdmin',        db: 'pulsecore' },
                { role: 'clusterMonitor', db: 'admin'     }
              ]
            });
          }
          print('RS + user OK');
        \"
      "

  # ── Inference sidecars — one per domain ────────────────────────────────────
  inference-infra:
    <<: *python-base
    container_name: pulsecore-inference-infra
    build:
      context: .
      dockerfile: inference/Dockerfile
    ports:
      - "${INFERENCE_INFRA_PORT:-8001}:8001"
    environment:
      ONNX_MODEL_PATH: ml/models/pulsecore_anomaly_infra.onnx
      FEATURE_MAP_PATH: ml/models/feature_map.json
      INFERENCE_PORT: "8001"
    volumes:
      - ./ml/models:/app/ml/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  inference-ecommerce:
    <<: *python-base
    container_name: pulsecore-inference-ecommerce
    build:
      context: .
      dockerfile: inference/Dockerfile
    ports:
      - "${INFERENCE_ECOMMERCE_PORT:-8002}:8001"
    environment:
      ONNX_MODEL_PATH: ml/models/pulsecore_anomaly_ecommerce.onnx
      FEATURE_MAP_PATH: ml/models/feature_map.json
      INFERENCE_PORT: "8001"
    volumes:
      - ./ml/models:/app/ml/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  inference-iot:
    <<: *python-base
    container_name: pulsecore-inference-iot
    build:
      context: .
      dockerfile: inference/Dockerfile
    ports:
      - "${INFERENCE_IOT_PORT:-8003}:8001"
    environment:
      ONNX_MODEL_PATH: ml/models/pulsecore_anomaly_iot.onnx
      FEATURE_MAP_PATH: ml/models/feature_map.json
      INFERENCE_PORT: "8001"
    volumes:
      - ./ml/models:/app/ml/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Consumer ───────────────────────────────────────────────────────────────
  consumer:
    <<: *python-base
    container_name: pulsecore-consumer
    build:
      context: .
      dockerfile: consumer/Dockerfile
    depends_on:
      kafka:     { condition: service_healthy }
      mongo-init: { condition: service_completed_successfully }
      inference-infra:     { condition: service_healthy }
      inference-ecommerce: { condition: service_healthy }
      inference-iot:       { condition: service_healthy }
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pulse.events}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-pulsecore-consumer}
      MONGODB_URL: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/pulsecore?replicaSet=rs0
      INFERENCE_URL_INFRA: http://inference-infra:8001
      INFERENCE_URL_ECOMMERCE: http://inference-ecommerce:8002
      INFERENCE_URL_IOT: http://inference-iot:8003
      INFERENCE_TIMEOUT_MS: ${INFERENCE_TIMEOUT_MS:-500}
      API_INTERNAL_URL: http://api:8000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me-in-production}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      LAG_THRESHOLD: ${LAG_THRESHOLD:-1000}

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    <<: *python-base
    container_name: pulsecore-api
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      inference-infra:     { condition: service_healthy }
      inference-ecommerce: { condition: service_healthy }
      inference-iot:       { condition: service_healthy }
    environment:
      MONGODB_URL: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/pulsecore?replicaSet=rs0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    container_name: pulsecore-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - pulsecore-net
    depends_on:
      api: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── Producers — one per domain ─────────────────────────────────────────────
  producer-infra:
    <<: *python-base
    container_name: pulsecore-producer-infra
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      DOMAIN: infra
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pulse.events}
      EVENTS_PER_SECOND: ${PRODUCER_INFRA_EPS:-5.0}

  producer-ecommerce:
    <<: *python-base
    container_name: pulsecore-producer-ecommerce
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      DOMAIN: ecommerce
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pulse.events}
      EVENTS_PER_SECOND: ${PRODUCER_ECOMMERCE_EPS:-3.0}

  producer-iot:
    <<: *python-base
    container_name: pulsecore-producer-iot
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      DOMAIN: iot
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pulse.events}
      EVENTS_PER_SECOND: ${PRODUCER_IOT_EPS:-4.0}

networks:
  pulsecore-net:
    driver: bridge

volumes:
  kafka_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
